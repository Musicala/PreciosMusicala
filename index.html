<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precios Musicala 2025</title>

  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #F4F4F4;
      margin: 0;
      padding: 0;
      color: #333;
      line-height: 1.6;
    }

    .header {
      background: #3949AB;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .header h1 { margin: 0; }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .filter-container {
      text-align: center;
      margin-bottom: 12px;
    }

    .filter-container select {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #CCC;
      border-radius: 5px;
      width: 280px;
    }

    /* Buscador */
    .search-wrap{
      display:flex;
      justify-content:center;
      align-items:stretch;
      gap:10px;
      margin: 0 auto 14px;
      max-width: 780px;
      position: relative;
    }
    .search-wrap input{
      flex:1;
      padding: 12px 12px;
      font-size: 16px;
      border: 1px solid #CCC;
      border-radius: 8px;
      outline: none;
    }
    .search-wrap input:focus{
      border-color:#1E88E5;
      box-shadow: 0 0 0 3px rgba(30,136,229,.15);
    }
    .search-actions{
      display:flex;
      gap:8px;
      align-items:stretch;
    }
    .btn-clear{
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background:#3949AB;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .btn-clear:hover{ background:#1E88E5; }

    .suggestions{
      position:absolute;
      left:0;
      right:0;
      top: 46px;
      background:#fff;
      border:1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,.10);
      z-index: 20;
      overflow:hidden;
      display:none;
      max-height: 260px;
      overflow-y:auto;
      text-align:left;
    }
    .s-item{
      padding: 10px 12px;
      border-bottom:1px solid #f0f0f0;
      cursor:pointer;
      font-size: 14px;
      line-height:1.35;
    }
    .s-item:last-child{ border-bottom:none; }
    .s-item:hover{ background:#F3F6FF; }
    .s-item strong{ color:#3949AB; }
    .s-meta{
      display:block;
      color:#666;
      font-size: 12px;
      margin-top: 2px;
    }

    .toggle-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    .toggle-buttons {
      text-align: center;
      margin-bottom: 0;
    }

    .toggle-buttons button {
      padding: 10px 20px;
      margin: 0 5px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #3949AB;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-buttons button.active { background-color: #1E88E5; }
    .toggle-buttons button:hover { background-color: #1E88E5; }

    .chk-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border:1px solid #ddd;
      border-radius: 999px;
      background:#fafafa;
      user-select:none;
      font-size: 14px;
    }
    .chk-wrap input{ transform: scale(1.15); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #CCC;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #3949AB;
      color: white;
    }

    tr:nth-child(even) { background: #F9F9F9; }
    tr:hover { background: #DCE775; }

    .logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 100px;
      height: auto;
      z-index: 1000;
      cursor: pointer;
    }

    .category-title {
      font-size: 24px;
      font-weight: bold;
      color: #3949AB;
      margin-top: 20px;
      border-bottom: 2px solid #3949AB;
      padding-bottom: 5px;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 30px;
    }

    .hidden { display: none; }

    .status {
      text-align: center;
      margin: 10px 0 0;
      font-size: 14px;
      color: #555;
    }
    .status strong { color: #3949AB; }

    .hint{
      text-align:center;
      font-size: 12px;
      color:#666;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <img class="logo"
       src="https://static.wixstatic.com/media/85afce_3adb3865c88a492b93a8bf2dc69049c3~mv2.png"
       alt="Logo Musicala">

  <div class="header">
    <h1>💵 Precios Musicala 2025</h1>
    <p>Servicios en Sede, Hogar y Virtual</p>
  </div>

  <div class="container">
    <!-- Buscador progresivo -->
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Buscar servicio… (ej: P8, Hogar, Musivacacional, Ensamble)">
      <div class="search-actions">
        <button class="btn-clear" id="btnClearSearch" type="button">Limpiar</button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="hint">Escribe y se filtra al vuelo. También puedes elegir una sugerencia.</div>

    <!-- Filtro por categoría -->
    <div class="filter-container">
      <label for="categoryFilter">Filtrar por categoría:</label>
      <select id="categoryFilter"></select>
    </div>

    <!-- Toggle + checkbox intensivos -->
    <div class="toggle-row">
      <div class="toggle-buttons">
        <button id="newStudentsBtn" class="active">Estudiantes Nuevos</button>
        <button id="oldStudentsBtn">Antiguos/Convenios</button>
      </div>

      <label class="chk-wrap" title="Muestra solo intensivos, agrupados en la categoría principal">
        <input type="checkbox" id="chkIntensivos">
        Mostrar intensivos
      </label>
    </div>

    <div id="status" class="status">Cargando precios desde Sheets (TSV)…</div>

    <div id="tablesRoot"></div>
  </div>

  <div class="footer">
    © Musicala 2025. Todos los derechos reservados.
  </div>

  <script>
    /***********************
     * CONFIG
     ***********************/
    const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRw8VZmjjgmjRSeriTc2ITE1VtuwDtxCMntos5N8kljm0svs5nMe-nb07vJSx2L6vRo9iT_S7CCIEZe/pub?gid=1700804701&single=true&output=tsv";

    // Encabezados esperados (exactos)
    const COLS = ["Categoria", "TipoEstudiante", "Servicio", "Precio", "Horas"];

    const TYPE_MAP = {
      new: "Estudiantes Nuevos",
      old: "Antiguos/Convenios"
    };

    /***********************
     * STATE
     ***********************/
    let rows = [];
    let categories = [];
    let currentType = "new";
    let showIntensivosOnly = false;
    let query = "";

    /***********************
     * DOM helpers
     ***********************/
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isError=false){
      const el = $("status");
      el.innerHTML = isError ? `<strong>Error:</strong> ${msg}` : msg;
      el.style.color = isError ? "#b00020" : "#555";
    }

    function escapeHTML(str){
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function idSafe(str){
      return String(str).replace(/[^\w\-]+/g, "_");
    }

    function norm(s){
      return String(s ?? "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // quita tildes
        .trim();
    }

    /***********************
     * Intensivos: helpers
     ***********************/
    function isIntensivoCategory(cat){
      return norm(cat).includes("intensivo");
    }

    function baseCategory(cat){
      // "Grupal Intensivo" => "Grupal"
      // "Personalizado intensivo" => "Personalizado"
      return String(cat ?? "").replace(/intensivo/ig, "").replace(/\s+/g, " ").trim();
    }

    function effectiveCategory(cat){
      // Si estamos en modo intensivos, agrupamos en categoría base
      return showIntensivosOnly ? baseCategory(cat) : cat;
    }

    /***********************
     * TSV parsing
     ***********************/
    function parseTSV(tsv){
      const lines = tsv.replace(/\r/g, "").split("\n").filter(Boolean);
      if(lines.length < 2) return { headers: [], data: [] };

      const headers = lines[0].split("\t").map(h => h.trim());
      const data = lines.slice(1).map(line => line.split("\t"));

      return { headers, data };
    }

    function indexMap(headers){
      const map = {};
      headers.forEach((h, i) => map[h] = i);
      return map;
    }

    async function loadTSV(){
      try{
        const res = await fetch(TSV_URL, { cache: "no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        const { headers, data } = parseTSV(text);
        const idx = indexMap(headers);

        const missing = COLS.filter(c => !(c in idx));
        if(missing.length){
          throw new Error(`Faltan columnas en la hoja: ${missing.join(", ")}. Encabezados esperados: ${COLS.join(" | ")}`);
        }

        rows = data.map(cols => {
          const v = (name) => (cols[idx[name]] ?? "").trim();
          return {
            Categoria: v("Categoria"),
            TipoEstudiante: v("TipoEstudiante"),
            Servicio: v("Servicio"),
            Precio: v("Precio"),
            Horas: v("Horas")
          };
        }).filter(r => r.Categoria && r.TipoEstudiante && r.Servicio);

        initUI();
        recomputeCategories();
        renderAll();
        setStatus("Listo. ✅");
      } catch(err){
        console.error(err);
        setStatus(
          `${escapeHTML(err.message)}<br><br>` +
          `Revisa encabezados exactos: <strong>${COLS.join(" | ")}</strong>.`,
          true
        );
      }
    }

    /***********************
     * UI init
     ***********************/
    function initUI(){
      // Toggle buttons
      $("newStudentsBtn").addEventListener("click", () => setType("new"));
      $("oldStudentsBtn").addEventListener("click", () => setType("old"));

      // Checkbox intensivos
      $("chkIntensivos").addEventListener("change", (e) => {
        showIntensivosOnly = !!e.target.checked;
        recomputeCategories();
        renderAll();
      });

      // Search
      const input = $("searchInput");
      const sug = $("suggestions");

      input.addEventListener("input", () => {
        query = input.value.trim();
        updateSuggestions();
        renderAll();
      });

      input.addEventListener("focus", () => {
        updateSuggestions();
      });

      document.addEventListener("click", (ev) => {
        // cerrar sugerencias si clic afuera
        if(!sug.contains(ev.target) && ev.target !== input){
          sug.style.display = "none";
        }
      });

      $("btnClearSearch").addEventListener("click", () => {
        input.value = "";
        query = "";
        $("suggestions").style.display = "none";
        renderAll();
      });

      // Dropdown categoría
      $("categoryFilter").addEventListener("change", filterCategory);
    }

    function setType(type){
      currentType = type;
      $("newStudentsBtn").classList.toggle("active", type === "new");
      $("oldStudentsBtn").classList.toggle("active", type === "old");
      updateSuggestions();
      renderAll();
    }

    function recomputeCategories(){
      // Filtramos filas según modo intensivos:
      // - Si showIntensivosOnly => solo filas cuya categoria incluye "Intensivo"
      // - Si NO => excluimos las categorias intensivas para no llenar de chorrero
      const pool = rows.filter(r => {
        const isInt = isIntensivoCategory(r.Categoria);
        return showIntensivosOnly ? isInt : !isInt;
      });

      categories = Array.from(new Set(pool.map(r => effectiveCategory(r.Categoria))))
        .sort((a,b) => a.localeCompare(b, "es"));

      // Rebuild dropdown
      const sel = $("categoryFilter");
      const current = sel.value || "all";
      sel.innerHTML = `
        <option value="all">Todas las categorías</option>
        ${categories.map(cat => `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`).join("")}
      `;

      // Mantener selección si existe
      if ([...sel.options].some(o => o.value === current)) sel.value = current;
      else sel.value = "all";

      // Rebuild table containers
      $("tablesRoot").innerHTML = categories.map(cat => `<div id="${idSafe(cat)}Table"></div>`).join("");
    }

    /***********************
     * Search: suggestions + matching
     ***********************/
    function getVisiblePool(){
      const typeLabel = TYPE_MAP[currentType];

      return rows.filter(r => {
        // Tipo
        if (r.TipoEstudiante !== typeLabel) return false;

        // Intensivos mode
        const isInt = isIntensivoCategory(r.Categoria);
        if (showIntensivosOnly && !isInt) return false;
        if (!showIntensivosOnly && isInt) return false;

        return true;
      });
    }

    function matchesQuery(r){
      if(!query) return true;
      const q = norm(query);
      const hay = norm(`${r.Servicio} ${effectiveCategory(r.Categoria)} ${r.Precio} ${r.Horas}`);
      return hay.includes(q);
    }

    function highlightMatch(text, qRaw){
      const t = String(text ?? "");
      const q = qRaw.trim();
      if(!q) return escapeHTML(t);

      // highlighting sencillo (sin volverse loco con tildes)
      const i = norm(t).indexOf(norm(q));
      if(i < 0) return escapeHTML(t);

      // aproximación: partimos por longitud del query
      const before = t.slice(0, i);
      const mid = t.slice(i, i + q.length);
      const after = t.slice(i + q.length);

      return `${escapeHTML(before)}<strong>${escapeHTML(mid)}</strong>${escapeHTML(after)}`;
    }

    function updateSuggestions(){
      const sug = $("suggestions");
      const q = query.trim();

      if(!q){
        sug.style.display = "none";
        sug.innerHTML = "";
        return;
      }

      const pool = getVisiblePool();

      // rank simple: primero los que empiezan por query, luego contiene
      const qn = norm(q);
      const scored = pool.map(r => {
        const s = norm(r.Servicio);
        let score = 999;
        if (s.startsWith(qn)) score = 0;
        else if (s.includes(qn)) score = 1;
        else if (norm(effectiveCategory(r.Categoria)).includes(qn)) score = 2;
        else score = 3;
        return { r, score };
      }).filter(x => x.score < 3);

      scored.sort((a,b) => a.score - b.score || a.r.Servicio.localeCompare(b.r.Servicio, "es"));

      const top = scored.slice(0, 10);
      if(!top.length){
        sug.style.display = "none";
        sug.innerHTML = "";
        return;
      }

      sug.innerHTML = top.map(({r}) => {
        const cat = effectiveCategory(r.Categoria);
        const label = `${r.Servicio}`;
        const meta = `${cat} • ${r.Precio}${r.Horas ? " • " + r.Horas : ""}`;
        return `
          <div class="s-item" data-serv="${escapeHTML(r.Servicio)}">
            ${highlightMatch(label, q)}
            <span class="s-meta">${escapeHTML(meta)}</span>
          </div>
        `;
      }).join("");

      sug.style.display = "block";

      // click en sugerencia => set input
      [...sug.querySelectorAll(".s-item")].forEach(el => {
        el.addEventListener("click", () => {
          const serv = el.getAttribute("data-serv") || "";
          $("searchInput").value = serv;
          query = serv;
          sug.style.display = "none";
          renderAll();
        });
      });
    }

    /***********************
     * Render
     ***********************/
    function renderAll(){
      const pool = getVisiblePool();

      // Render por categoría (ya “efectiva” si intensivos está activo)
      categories.forEach(cat => {
        const containerId = `${idSafe(cat)}Table`;

        const data = pool
          .filter(r => effectiveCategory(r.Categoria) === cat)
          .filter(matchesQuery);

        renderTable(containerId, cat, data);
      });

      filterCategory();

      // Mensajito si el search dejó todo vacío
      if(query){
        const any = categories.some(cat => {
          const el = $(idSafe(cat) + "Table");
          return el && !el.classList.contains("hidden") && el.querySelector("table");
        });
        if(!any){
          setStatus(`No hay resultados para: <strong>${escapeHTML(query)}</strong> 😶‍🌫️`, false);
        } else {
          setStatus("Listo. ✅");
        }
      } else {
        setStatus("Listo. ✅");
      }
    }

    function filterCategory(){
      const filter = $("categoryFilter").value;
      categories.forEach(cat => {
        const id = `${idSafe(cat)}Table`;
        $(id).classList.toggle("hidden", filter !== "all" && filter !== cat);
      });
    }

    function renderTable(containerId, categoryName, data){
      const container = $(containerId);

      if(!data.length){
        container.innerHTML = `
          <h2 class="category-title">${escapeHTML(categoryName)}</h2>
          <div class="status">No hay precios que coincidan con lo que estás filtrando.</div>
        `;
        return;
      }

      const showHours = data.some(x => x.Horas && x.Horas.trim() !== "");

      container.innerHTML = `
        <h2 class="category-title">${escapeHTML(categoryName)}</h2>
        <table>
          <thead>
            <tr>
              <th>Servicio</th>
              ${showHours ? "<th>Horas</th>" : ""}
              <th>Precio</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(item => `
              <tr>
                <td>${escapeHTML(item.Servicio)}</td>
                ${showHours ? `<td>${escapeHTML(item.Horas)}</td>` : ""}
                <td>${escapeHTML(item.Precio)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    window.addEventListener("load", loadTSV);
  </script>
</body>
</html>
