<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Precios Musicala 2026</title>

  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:0;
      color:#222;
    }
    header{
      background:#3949ab;
      color:white;
      padding:20px;
      text-align:center;
    }
    header h1{ margin:0 }
    header p{ margin:6px 0 0; opacity:.95; }

    .container{
      max-width:1100px;
      margin:20px auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-bottom:15px;
    }
    select, input{
      padding:10px;
      font-size:15px;
      border-radius:8px;
      border:1px solid #ccc;
      min-width:240px;
      background:#fff;
    }
    input:focus, select:focus{
      outline:none;
      border-color:#3949ab;
      box-shadow:0 0 0 3px rgba(57,73,171,.15);
    }

    .toggle-buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    .pill{
      padding:10px 18px;
      font-size:15px;
      font-weight:700;
      border:none;
      border-radius:999px;
      background:#1e88e5;
      color:white;
      user-select:none;
    }

    .btn{
      padding:10px 18px;
      font-size:15px;
      font-weight:700;
      border:none;
      border-radius:999px;
      cursor:pointer;
      color:white;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:.2s;
      box-shadow:0 6px 16px rgba(0,0,0,.12);
      white-space:nowrap;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 22px rgba(0,0,0,.16);
    }

    .btn-pagos{ background:#2e7d32; }
    .btn-pagos:hover{ background:#1b5e20; }

    .btn-rip{ background:#6a1b9a; }
    .btn-rip:hover{ background:#4a148c; }

    .btn-galeria{ background:#1565c0; }
    .btn-galeria:hover{ background:#0d47a1; }

    .chk{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      background:#f6f6f6;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid #ddd;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }
    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:left;
    }
    th{
      background:#3949ab;
      color:white;
    }
    tr:nth-child(even){ background:#fafafa; }
    tr:hover{ background:#e8eaf6; }

    .muted{
      color:#777;
      font-size:13px;
      text-align:center;
      margin-top:8px;
    }
    .price{ font-weight:800; }
    .empty{ color:#aaa; font-style:italic; }
    .errorBox{
      margin-top:12px;
      padding:10px 12px;
      border:1px solid #f3c6c6;
      background:#fff5f5;
      color:#9b1c1c;
      border-radius:10px;
      display:none;
      white-space:pre-wrap;
      font-size:13px;
    }

    /* =========================
       Galería embebida
    ========================== */
    .gallery-wrap{
      margin-top:18px;
      border:1px solid #e5e5e5;
      border-radius:12px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 24px rgba(0,0,0,.06);
    }
    .gallery-head{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      background:linear-gradient(180deg, #f7f9ff, #ffffff);
      border-bottom:1px solid #eee;
    }
    .gallery-head .title{
      font-weight:800;
      color:#18224a;
    }
    .gallery-head .sub{
      font-size:12px;
      color:#667;
      margin-top:2px;
    }
    .gallery-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn-mini{
      padding:8px 12px;
      font-size:13px;
      font-weight:800;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff;
      cursor:pointer;
      transition:.2s;
      text-decoration:none;
      color:#223;
      box-shadow:0 6px 14px rgba(0,0,0,.06);
    }
    .btn-mini:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px rgba(0,0,0,.10);
      border-color:rgba(0,0,0,.14);
    }
    .gallery-iframe{
      width:100%;
      height:min(78vh, 980px);
      border:0;
      background:#fff;
      display:block;
    }
    .hidden{ display:none !important; }

    @media (max-width: 560px){
      select, input{ min-width: 100%; }
      .gallery-head{ flex-direction:column; align-items:flex-start; }
      .gallery-actions{ width:100%; justify-content:flex-start; }
      .gallery-iframe{ height: 78vh; }
    }
  </style>
</head>

<body>

<header>
  <h1>Precios Musicala</h1>
  <p>Musicala · 2026</p>
</header>

<div class="container">

  <div class="controls">
    <select id="categoryFilter">
      <option value="">Todas las categorías</option>
    </select>

    <input id="searchInput" type="text" placeholder="Buscar servicio…" list="suggestions" />
    <datalist id="suggestions"></datalist>
  </div>

  <div class="controls">
    <div class="toggle-buttons">
      <span class="pill">2026</span>

      <a class="btn btn-pagos" href="https://musicala.github.io/registrodepagos2026/" target="_blank" rel="noopener">
        Registro de pagos
      </a>

      <a class="btn btn-rip" href="https://musicala.github.io/RIP2026/" target="_blank" rel="noopener">
        RIP 2026
      </a>

      <button class="btn btn-galeria" id="btnToggleGaleria" type="button">
        Galería (imágenes)
      </button>
    </div>

    <label class="chk">
      <input type="checkbox" id="chkAntiguos" checked>
      Antiguos / Convenios
    </label>

    <label class="chk">
      <input type="checkbox" id="chkNuevos" checked>
      Estudiantes nuevos
    </label>

    <label class="chk">
      <input type="checkbox" id="chkIntensivos">
      Intensivos
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th>Categoría</th>
        <th>Tipo</th>
        <th>Servicio</th>
        <th id="priceHeader">Precio 2026</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="muted" id="metaInfo"></div>
  <div class="errorBox" id="errorBox"></div>

  <!-- =========================
       GALERÍA EMBEBIDA
       (Se abre/cierra con botón)
  ========================== -->
  <section class="gallery-wrap hidden" id="galleryWrap" aria-label="Galería de precios (imágenes)">
    <div class="gallery-head">
      <div>
        <div class="title">Galería de precios (imágenes)</div>
        <div class="sub">Vista rápida en formato imagen, embebida desde tu galería.</div>
      </div>

      <div class="gallery-actions">
        <a class="btn-mini" href="https://alekcaballero20.github.io/preciosgaleria/" target="_blank" rel="noopener">
          Abrir en pestaña nueva
        </a>
        <button class="btn-mini" type="button" id="btnCerrarGaleria">Cerrar</button>
      </div>
    </div>

    <iframe
      class="gallery-iframe"
      id="galleryIframe"
      src="https://alekcaballero20.github.io/preciosgaleria/"
      title="Galería de precios Musicala"
      loading="lazy"
      referrerpolicy="no-referrer">
    </iframe>
  </section>

</div>

<script>
  // ✅ TSV publicado
  const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRw8VZmjjgmjRSeriTc2ITE1VtuwDtxCMntos5N8kljm0svs5nMe-nb07vJSx2L6vRo9iT_S7CCIEZe/pub?gid=1700804701&single=true&output=tsv";

  // Columnas por posición (0-based):
  // A=0 Categoria | B=1 TipoEstudiante | C=2 Servicio | E=4 Precio 2026
  const COL = { cat:0, tipo:1, serv:2, p2026:4 };

  let DATA = [];

  const qs = (s) => document.querySelector(s);

  boot();
  initGallery();

  async function boot(){
    try{
      const res = await fetch(TSV_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status + " al cargar TSV");
      const txt = await res.text();

      const lines = txt.replace(/\r/g,"").trim().split("\n");
      if(lines.length < 2) throw new Error("TSV vacío o sin filas suficientes.");

      // Primer fila: headers (no confiamos en nombres, solo en posiciones)
      lines.shift();

      // Parse filas por posiciones
      DATA = lines.map(line=>{
        const cols = line.split("\t");
        return {
          Categoria: (cols[COL.cat]  || "").trim(),
          TipoEstudiante: (cols[COL.tipo] || "").trim(),
          Servicio: (cols[COL.serv] || "").trim(),
          Precio2026: (cols[COL.p2026] || "").trim(),
        };
      }).filter(r => r.Categoria || r.TipoEstudiante || r.Servicio); // limpia basura

      qs("#metaInfo").textContent =
        `Cargadas ${DATA.length} filas. Columnas detectadas (por posición): A/B/C/E.`;

      populateCategories();
      populateSuggestions();
      render();

    }catch(err){
      showError("Error cargando datos:\n" + (err?.message || err));
      console.error(err);
    }
  }

  function showError(msg){
    const box = qs("#errorBox");
    box.style.display = "block";
    box.textContent = msg;
  }

  function populateCategories(){
    const sel = qs("#categoryFilter");
    sel.querySelectorAll("option:not(:first-child)").forEach(o=>o.remove());

    const cats = [...new Set(DATA.map(d => d.Categoria).filter(Boolean))].sort();
    cats.forEach(c=>{
      const o = document.createElement("option");
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    });
  }

  function populateSuggestions(){
    const dl = qs("#suggestions");
    dl.innerHTML = "";

    const services = [...new Set(DATA.map(d => d.Servicio).filter(Boolean))].slice(0,200);
    services.forEach(s=>{
      const o=document.createElement("option");
      o.value=s;
      dl.appendChild(o);
    });
  }

  function render(){
    const tbody = qs("#tbody");
    tbody.innerHTML = "";

    const cat = qs("#categoryFilter").value;
    const q = qs("#searchInput").value.toLowerCase();
    const showAnt = qs("#chkAntiguos").checked;
    const showNew = qs("#chkNuevos").checked;
    const showInt = qs("#chkIntensivos").checked;

    qs("#priceHeader").textContent = "Precio 2026";

    const rows = DATA.filter(d=>{
      if(cat && d.Categoria !== cat) return false;

      if(q){
        const hay = (d.Servicio || "").toLowerCase();
        if(!hay.includes(q)) return false;
      }

      const tipo = d.TipoEstudiante || "";
      if(!showAnt && tipo.toLowerCase().includes("antiguos")) return false;
      if(!showNew && tipo.toLowerCase().includes("nuevos")) return false;

      const serv = (d.Servicio || "").toLowerCase();
      const esInt = serv.includes("intensivo");
      if(!showInt && esInt) return false;

      return true;
    });

    rows.forEach(d=>{
      const tr = document.createElement("tr");
      const price = d.Precio2026;

      tr.innerHTML = `
        <td>${escapeHtml(d.Categoria)}</td>
        <td>${escapeHtml(d.TipoEstudiante)}</td>
        <td>${escapeHtml(d.Servicio)}</td>
        <td class="price">${price ? escapeHtml(price) : "<span class='empty'>—</span>"}</td>
      `;
      tbody.appendChild(tr);
    });

    if(rows.length === 0){
      const tr=document.createElement("tr");
      tr.innerHTML = `<td colspan="4" class="empty">Sin resultados con esos filtros.</td>`;
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // eventos de filtros
  ["categoryFilter","searchInput","chkAntiguos","chkNuevos","chkIntensivos"]
    .forEach(id => qs("#"+id).addEventListener("input", render));

  /* =========================
     Galería: abrir/cerrar
  ========================== */
  function initGallery(){
    const wrap = qs("#galleryWrap");
    const btn = qs("#btnToggleGaleria");
    const btnClose = qs("#btnCerrarGaleria");

    btn.addEventListener("click", ()=>{
      const isHidden = wrap.classList.contains("hidden");
      wrap.classList.toggle("hidden");

      // Si se abre, baja suave hacia la galería
      if(isHidden){
        setTimeout(()=> wrap.scrollIntoView({ behavior:"smooth", block:"start" }), 50);
        btn.textContent = "Ocultar galería";
      }else{
        btn.textContent = "Galería (imágenes)";
      }
    });

    btnClose.addEventListener("click", ()=>{
      wrap.classList.add("hidden");
      btn.textContent = "Galería (imágenes)";
      // vuelve arriba un poquito para que no se sienta raro
      setTimeout(()=> window.scrollTo({ top: 0, behavior:"smooth" }), 50);
    });
  }
</script>

</body>
</html>
