<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comparador de Precios Musicala</title>

  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:0;
      color:#222;
    }
    header{
      background:#3949ab;
      color:white;
      padding:20px;
      text-align:center;
    }
    header h1{ margin:0 }
    .container{
      max-width:1100px;
      margin:20px auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-bottom:15px;
    }
    select, input{
      padding:10px;
      font-size:15px;
      border-radius:8px;
      border:1px solid #ccc;
      min-width:240px;
    }
    input:focus, select:focus{
      outline:none;
      border-color:#3949ab;
      box-shadow:0 0 0 3px rgba(57,73,171,.15);
    }
    .toggle-buttons button,
    .btn-pagos{
      padding:10px 18px;
      font-size:15px;
      font-weight:600;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#3949ab;
      color:white;
      transition:.2s;
    }
    .toggle-buttons button.active{ background:#1e88e5; }
    .toggle-buttons button:hover{ background:#1e88e5; }

    .btn-pagos{
      background:#2e7d32;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn-pagos:hover{
      background:#1b5e20;
      transform:translateY(-1px);
    }
    .chk{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
      background:#f6f6f6;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid #ddd;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }
    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:left;
    }
    th{
      background:#3949ab;
      color:white;
    }
    tr:nth-child(even){ background:#fafafa; }
    tr:hover{ background:#e8eaf6; }

    .muted{
      color:#777;
      font-size:13px;
      text-align:center;
      margin-top:8px;
    }
    .price{ font-weight:700; }
    .empty{ color:#aaa; font-style:italic; }
    .errorBox{
      margin-top:12px;
      padding:10px 12px;
      border:1px solid #f3c6c6;
      background:#fff5f5;
      color:#9b1c1c;
      border-radius:10px;
      display:none;
      white-space:pre-wrap;
      font-size:13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Comparador de Precios</h1>
  <p>Musicala · 2025 vs 2026</p>
</header>

<div class="container">

  <div class="controls">
    <select id="categoryFilter">
      <option value="">Todas las categorías</option>
    </select>

    <input id="searchInput" type="text" placeholder="Buscar servicio…" list="suggestions" />
    <datalist id="suggestions"></datalist>
  </div>

  <div class="controls">
    <div class="toggle-buttons">
      <button id="btn2025" class="active">2025</button>
      <button id="btn2026">2026</button>
      <a class="btn-pagos" href="https://musicala.github.io/registrodepagos2026/" target="_blank" rel="noopener">
        Registro de pagos
      </a>
    </div>

    <label class="chk">
      <input type="checkbox" id="chkAntiguos" checked>
      Antiguos / Convenios
    </label>

    <label class="chk">
      <input type="checkbox" id="chkNuevos" checked>
      Estudiantes nuevos
    </label>

    <label class="chk">
      <input type="checkbox" id="chkIntensivos">
      Intensivos
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th>Categoría</th>
        <th>Tipo</th>
        <th>Servicio</th>
        <th id="priceHeader">Precio 2025</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="muted" id="metaInfo"></div>
  <div class="errorBox" id="errorBox"></div>

</div>

<script>
  // ✅ TSV publicado
  const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRw8VZmjjgmjRSeriTc2ITE1VtuwDtxCMntos5N8kljm0svs5nMe-nb07vJSx2L6vRo9iT_S7CCIEZe/pub?gid=1700804701&single=true&output=tsv";

  // Columnas por posición (0-based):
  // A=0 Categoria | B=1 TipoEstudiante | C=2 Servicio | D=3 Precio 2025 | E=4 Precio 2026
  const COL = { cat:0, tipo:1, serv:2, p2025:3, p2026:4 };

  let DATA = [];
  let YEAR = "2025"; // "2025" o "2026"

  const qs = (s) => document.querySelector(s);

  boot();

  async function boot(){
    try{
      const res = await fetch(TSV_URL, { cache: "no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status + " al cargar TSV");
      const txt = await res.text();

      const lines = txt.replace(/\r/g,"").trim().split("\n");
      if(lines.length < 2) throw new Error("TSV vacío o sin filas suficientes.");

      // Primer fila: headers (no confiamos en nombres, solo en posiciones)
      const headers = lines.shift().split("\t").map(s => (s || "").trim());

      // Parse filas por posiciones
      DATA = lines.map(line=>{
        const cols = line.split("\t");
        return {
          Categoria: (cols[COL.cat]  || "").trim(),
          TipoEstudiante: (cols[COL.tipo] || "").trim(),
          Servicio: (cols[COL.serv] || "").trim(),
          Precio2025: (cols[COL.p2025] || "").trim(),
          Precio2026: (cols[COL.p2026] || "").trim(),
        };
      }).filter(r => r.Categoria || r.TipoEstudiante || r.Servicio); // limpia basura

      qs("#metaInfo").textContent =
        `Cargadas ${DATA.length} filas. Columnas detectadas (por posición): A/B/C/D/E.`;

      populateCategories();
      populateSuggestions();
      render();

    }catch(err){
      showError("Error cargando datos:\n" + (err?.message || err));
      console.error(err);
    }
  }

  function showError(msg){
    const box = qs("#errorBox");
    box.style.display = "block";
    box.textContent = msg;
  }

  function populateCategories(){
    const sel = qs("#categoryFilter");
    // limpia options excepto el primero
    sel.querySelectorAll("option:not(:first-child)").forEach(o=>o.remove());

    const cats = [...new Set(DATA.map(d => d.Categoria).filter(Boolean))].sort();
    cats.forEach(c=>{
      const o = document.createElement("option");
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    });
  }

  function populateSuggestions(){
    const dl = qs("#suggestions");
    dl.innerHTML = "";

    // top 200 servicios únicos para no reventar el DOM
    const services = [...new Set(DATA.map(d => d.Servicio).filter(Boolean))].slice(0,200);
    services.forEach(s=>{
      const o=document.createElement("option");
      o.value=s;
      dl.appendChild(o);
    });
  }

  function render(){
    const tbody = qs("#tbody");
    tbody.innerHTML = "";

    const cat = qs("#categoryFilter").value;
    const q = qs("#searchInput").value.toLowerCase();
    const showAnt = qs("#chkAntiguos").checked;
    const showNew = qs("#chkNuevos").checked;
    const showInt = qs("#chkIntensivos").checked;

    qs("#priceHeader").textContent = "Precio " + YEAR;

    const rows = DATA.filter(d=>{
      if(cat && d.Categoria !== cat) return false;

      if(q){
        const hay = (d.Servicio || "").toLowerCase();
        if(!hay.includes(q)) return false;
      }

      const tipo = d.TipoEstudiante || "";
      if(!showAnt && tipo.toLowerCase().includes("antiguos")) return false;
      if(!showNew && tipo.toLowerCase().includes("nuevos")) return false;

      const serv = (d.Servicio || "").toLowerCase();
      const esInt = serv.includes("intensivo");
      if(!showInt && esInt) return false;

      return true;
    });

    rows.forEach(d=>{
      const tr = document.createElement("tr");
      const price = (YEAR === "2025") ? d.Precio2025 : d.Precio2026;

      tr.innerHTML = `
        <td>${escapeHtml(d.Categoria)}</td>
        <td>${escapeHtml(d.TipoEstudiante)}</td>
        <td>${escapeHtml(d.Servicio)}</td>
        <td class="price">${price ? escapeHtml(price) : "<span class='empty'>—</span>"}</td>
      `;
      tbody.appendChild(tr);
    });

    if(rows.length === 0){
      const tr=document.createElement("tr");
      tr.innerHTML = `<td colspan="4" class="empty">Sin resultados con esos filtros.</td>`;
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // eventos
  ["categoryFilter","searchInput","chkAntiguos","chkNuevos","chkIntensivos"]
    .forEach(id => qs("#"+id).addEventListener("input", render));

  qs("#btn2025").addEventListener("click", ()=>{
    YEAR="2025";
    qs("#btn2025").classList.add("active");
    qs("#btn2026").classList.remove("active");
    render();
  });

  qs("#btn2026").addEventListener("click", ()=>{
    YEAR="2026";
    qs("#btn2026").classList.add("active");
    qs("#btn2025").classList.remove("active");
    render();
  });
</script>

</body>
</html>
